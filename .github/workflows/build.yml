name: Build Telegram Desktop Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT: "5.15.19"
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  build:
    name: Windows x64 Debug
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $name = $repo.Split('/')[-1]
          $tbuild = "$env:GITHUB_WORKSPACE\TBuild"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\TBuild\Libraries" | Out-Null
          if (-not (Test-Path "$tbuild")) {
            New-Item -ItemType SymbolicLink -Path "$tbuild" -Target "$env:USERPROFILE\TBuild" | Out-Null
          }
          "TBUILD=$tbuild" >> $env:GITHUB_ENV
          "REPO_NAME=$name" >> $env:GITHUB_ENV
          "LibrariesPath=$tbuild\$name\Libraries\win64" >> $env:GITHUB_ENV

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First setup - extract SDK version
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Remove /Zi from debug flags to reduce PDB size
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Setup MSVC (official Telegram action)
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Install MSYS2 tools via Chocolatey (fix for missing packages)
        run: |
          choco install make diffutils gperf nasm pkgconf -y
          refreshenv

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Free disk space (pre-prepare cleanup)
        shell: pwsh
        run: |
          # Remove unnecessary Windows components to free space
          Write-Host "Free space before cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-Table -AutoSize
          # Clean temp
          if (Test-Path "$env:TEMP") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TEMP\*" }
          if (Test-Path "$env:TMP") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TMP\*" }
          # Clean NuGet cache
          if (Test-Path "$env:USERPROFILE\.nuget\packages") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:USERPROFILE\.nuget\packages\*" }
          # Clean Chocolatey cache
          if (Test-Path "C:\ProgramData\chocolatey\lib") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\ProgramData\chocolatey\lib\*" }
          Write-Host "Free space after cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-Table -AutoSize

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Cache Libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\Qt*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\Qt*
            ${{ env.LibrariesPath }}\cache_keys\Qt*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Prepare Libraries (win.bat)
        run: |
          cd ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          set QT=5.15.19
          call Telegram\build\prepare\win.bat skip-release silent

      - name: Free disk space (cleanup ThirdParty after prepare)
        shell: pwsh
        run: |
          # Remove ThirdParty - no longer needed after prepare
          $thirdParty = "${{ env.TBUILD }}\${{ env.REPO_NAME }}\ThirdParty"
          if (Test-Path $thirdParty) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $thirdParty
            Write-Host "Removed ThirdParty: $thirdParty"
          }
          # Clean Libraries: keep only .lib, .a, .exe, headers, .cmake, .pc, include/, objects-*, cache_keys/, patches/, nv-codec-headers/
          $libsPath = "${{ env.LibrariesPath }}"
          if (Test-Path $libsPath) {
            Get-ChildItem -Recurse -File $libsPath | Where-Object {
              $_.Extension -notin '.lib','.a','.exe','.h','.hpp','.inc','.cmake','.pc' -and
              $_.FullName -notmatch '\\include\\' -and
              $_.FullName -notmatch '\\objects-.*\\' -and
              $_.FullName -notmatch '\\cache_keys\\' -and
              $_.FullName -notmatch '\\patches\\' -and
              $_.FullName -notmatch '\\nv-codec-headers\\'
            } | Remove-Item -Force -ErrorAction SilentlyContinue
            # Remove empty directories
            Get-ChildItem -Recurse -Directory $libsPath | Where-Object { @(Get-ChildItem -Recurse $_).Count -eq 0 } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleaned Libraries: $libsPath"
          }
          # Show free space
          $disk = Get-PSDrive C
          Write-Host "Free space: $([math]::Round($disk.Free/1GB, 2)) GB"

      - name: Configure CMake (Debug, Qt5)
        run: |
          cd ${{ env.TBUILD }}\${{ env.REPO_NAME }}\Telegram
          set QT=5.15.19
          set QT_VERSION_MAJOR=5
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% -D CMAKE_CONFIGURATION_TYPES=Debug -D CMAKE_COMPILE_WARNING_AS_ERROR=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D QT_VERSION_MAJOR=5

      - name: Build Telegram (Debug)
        run: |
          set QT=5.15.19
          cmake --build ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out --config Debug --parallel

      - name: Prepare artifacts
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          copy %OUT%\Telegram.exe artifact\
          copy %OUT%\Updater.exe artifact\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-x64
          path: artifact/
          retention-days: 30

      - name: Create Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifact/Telegram.exe
            artifact/Updater.exe
          generate_release_notes: true