name: Build Aqzelo Installer

on:
  push:
    tags: ['v*']
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). Leave empty to auto-detect from Telegram/build/version + build number'
        required: false
        type: string

permissions:
  contents: write

env:
  QT_VERSION: "5.15.19"
  QT_ARCH: "win64_msvc2019_64"
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"
  BUILD_TYPE: "Release"
  APP_NAME: "Aqzelo"

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_tag: ${{ steps.get_version.outputs.version_tag }}
      is_beta: ${{ steps.get_version.outputs.is_beta }}
      full_version: ${{ steps.get_version.outputs.full_version }}

    steps:
      - name: Checkout AqzeloDesktop (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect version from Telegram/build/version + build number
        id: get_version
        run: |
          @echo off
          setlocal enabledelayedexpansion

          if not exist Telegram\build\version (
            echo "::error::Telegram/build/version not found"
            exit /b 1
          )

          for /f "tokens=2" %%a in ('findstr /r "^AppVersionOriginal" Telegram\build\version') do (
            set BASE_VERSION=%%a
          )

          if "!BASE_VERSION!"=="" (
            echo "::error::AppVersionOriginal not found in version file"
            exit /b 1
          )

          echo Base version: !BASE_VERSION!

          for /f "tokens=2" %%a in ('findstr /r "^BetaChannel" Telegram\build\version') do (
            set BETA=%%a
          )

          echo Beta channel: !BETA!

          REM Build number from GitHub run number
          set BUILD_NUM=%GITHUB_RUN_NUMBER%
          echo Build number: !BUILD_NUM!

          REM Construct full version with build metadata (semver compatible)
          set FULL_VERSION=!BASE_VERSION!-build.!BUILD_NUM!

          if "!BETA!"=="1" (
            set VERSION_TAG=v!FULL_VERSION!-beta
            set IS_BETA=true
          ) else (
            set VERSION_TAG=v!FULL_VERSION!
            set IS_BETA=false
          )

          echo Detected full version: !FULL_VERSION!
          echo Version tag: !VERSION_TAG!

          echo version=!BASE_VERSION! >> %GITHUB_OUTPUT%
          echo full_version=!FULL_VERSION! >> %GITHUB_OUTPUT%
          echo version_tag=!VERSION_TAG! >> %GITHUB_OUTPUT%
          echo is_beta=!IS_BETA! >> %GITHUB_OUTPUT%

          if "%GITHUB_EVENT_NAME%"=="workflow_dispatch" (
            if not "%{{ github.event.inputs.version }}"=="" (
              echo "Using manual version: ${{ github.event.inputs.version }}"
              echo version_tag=${{ github.event.inputs.version }} >> %GITHUB_OUTPUT%
              echo full_version=${{ github.event.inputs.version }} >> %GITHUB_OUTPUT%
            )
          )

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Install Rust (for tlottie)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install Inno Setup (for installer)
        run: |
          choco install innosetup --version 6.2.2 -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare build environment
        run: |
          cd Telegram
          call build\prepare\win.bat
          cd ..

      - name: Configure CMake
        run: |
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% -D CMAKE_BUILD_TYPE=%BUILD_TYPE%

      - name: Build Aqzelo
        run: |
          cmake --build out --config %BUILD_TYPE% --target Telegram --parallel

      - name: Copy and patch Inno Setup script
        run: |
          copy Telegram\build\setup.iss out\Release\setup.iss
          powershell -Command ^
            "$v='${{ steps.get_version.outputs.full_version }}'; ^
            (Get-Content out\Release\setup.iss) -replace 'AppVersionOriginal.*', 'AppVersionOriginal ' + $v -replace '#define MyAppVersion \".*\"', '#define MyAppVersion \"' + $v + '\"' -replace 'AppName=Telegram Desktop', 'AppName=Aqzelo' -replace 'AppId=\\{53F49750-6209-4FBF-9CA8-7A333C87D1ED\\}', 'AppId={A1B2C3D4-E5F6-7890-ABCD-EF1234567890}' -replace 'DefaultDirName=\\{userappdata\\}\\\\Telegram Desktop', 'DefaultDirName={userappdata}\Aqzelo' -replace 'Telegram.exe', 'Aqzelo.exe' | Set-Content out\Release\setup.iss -Encoding UTF8"

      - name: Build Installer (Inno Setup)
        run: |
          iscc out\Release\setup.iss

      - name: Find artifacts
        id: artifacts
        run: |
          dir out\Release\Aqzelo.exe
          dir out\Release\Aqzelo_*.exe
          echo "EXE=out\Release\Aqzelo.exe" >> %GITHUB_OUTPUT%
          for %%f in (out\Release\Aqzelo_*.exe) do echo "INSTALLER=%%f" >> %GITHUB_OUTPUT%

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aqzelo-${{ steps.get_version.outputs.version_tag }}-windows
          path: |
            out/Release/Aqzelo.exe
            out/Release/Aqzelo_*.exe
          retention-days: 30

      - name: Create Release (push tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Aqzelo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/Release/Aqzelo.exe
            out/Release/Aqzelo_*.exe
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_beta == 'true' }}

      - name: Create Release (push to master/main with build number)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version_tag }}
          name: Aqzelo ${{ steps.get_version.outputs.version_tag }}
          generate_release_notes: true
          files: |
            out/Release/Aqzelo.exe
            out/Release/Aqzelo_*.exe
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_beta == 'true' }}

      - name: Create Release (workflow_dispatch with auto version)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version_tag }}
          name: Aqzelo ${{ steps.get_version.outputs.version_tag }}
          generate_release_notes: true
          files: |
            out/Release/Aqzelo.exe
            out/Release/Aqzelo_*.exe
          draft: false
          prerelease: ${{ steps.get_version.outputs.is_beta == 'true' }}

      - name: Create Release (workflow_dispatch with manual version)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Aqzelo ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            out/Release/Aqzelo.exe
            out/Release/Aqzelo_*.exe
          draft: false
          prerelease: false