name: Build Telegram Desktop Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  build:
    name: Windows x64 Debug
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First setup - extract SDK version
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Remove /Zi from debug flags to reduce PDB size
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Setup MSVC (official Telegram action)
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: Install MSYS2 tools via Chocolatey (fix for missing packages)
        run: |
          choco install make diffutils gperf nasm strawberryperl pkgconf --version=2.1.0 -y
          refreshenv

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Cache Libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\Qt*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\Qt*
            ${{ env.LibrariesPath }}\cache_keys\Qt*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Prepare Libraries (win.bat)
        run: |
          cd ${{ env.TBUILD }}\${{ env.REPO_NAME }}
          call Telegram\build\prepare\win.bat skip-release silent

      - name: Free disk space
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Configure CMake (Debug, Qt5)
        run: |
          cd ${{ env.TBUILD }}\${{ env.REPO_NAME }}\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% -D CMAKE_CONFIGURATION_TYPES=Debug -D CMAKE_COMPILE_WARNING_AS_ERROR=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D CMAKE_PREFIX_PATH=%LibrariesPath%\Qt5

      - name: Build Telegram (Debug)
        run: |
          cmake --build ${{ env.TBUILD }}\${{ env.REPO_NAME }}\out --config Debug --parallel

      - name: Prepare artifacts
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          copy %OUT%\Telegram.exe artifact\
          copy %OUT%\Updater.exe artifact\

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-x64
          path: artifact/
          retention-days: 30

      - name: Create Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifact/Telegram.exe
            artifact/Updater.exe
          generate_release_notes: true