name: Build Telegram Desktop Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT: "5.15.19"
  TDESKTOP_API_ID: "2040"
  TDESKTOP_API_HASH: "b18441a1ff607e10a989891a5462e627"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"
  TBUILD_ROOT: ${{ github.workspace }}\TBuild
  REPO_NAME: ${{ github.repository }}

jobs:
  build:
    name: Windows x64 Debug
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $name = $repo.Split('/')[-1]
          $tbuild = "$env:GITHUB_WORKSPACE\TBuild"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\TBuild\Libraries" | Out-Null
          if (-not (Test-Path "$tbuild")) {
            New-Item -ItemType SymbolicLink -Path "$tbuild" -Target "$env:USERPROFILE\TBuild" | Out-Null
          }
          "TBUILD=$tbuild" >> $env:GITHUB_ENV
          "REPO_NAME=$name" >> $env:GITHUB_ENV
          "LibrariesPath=$tbuild\$name\Libraries\win64" >> $env:GITHUB_ENV

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          path: ${{ github.workspace }}\TBuild\${{ github.event.repository.name }}

      - name: First setup - extract SDK version
        shell: bash
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          TBUILD="${{ github.workspace }}\TBuild"
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Remove /Zi from debug flags to reduce PDB size
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Setup MSVC (VS 2026)
        shell: pwsh
        run: |
          # VS 2026 Enterprise path on windows-latest
          $vcvars = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            # Fallback to BuildTools
            $vcvars = "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvarsall.bat"
          }
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat not found"
            exit 1
          }
          # Use SDK 10.0.26100.0 with v144 toolset (VS 2022 compatible, supports Win7)
          # Correct syntax: vcvarsall.bat [arch] [winsdk_version] [-vcvars_ver=vc_version]
          & $vcvars x64 10.0.26100.0 -vcvars_ver=14.44
          # Persist environment for subsequent steps (except PATH - use GITHUB_PATH for that)
          $envs = @("VCINSTALLDIR", "VSINSTALLDIR", "VCToolsVersion", "WindowsSDKVersion", "Platform", "LibPath", "IncludePath", "LIB", "INCLUDE")
          foreach ($e in $envs) {
            $val = ${env:$e}
            if ($val) {
              $line = "$e=$val"
              "echo `"$line`" >> $env:GITHUB_ENV" | Invoke-Expression
            }
          }
          # Persist PATH separately via GITHUB_PATH
          $env:PATH >> $env:GITHUB_PATH

      - name: Install MSYS2 tools via Chocolatey (fix for missing packages)
        shell: pwsh
        run: |
          choco install make diffutils gperf nasm pkgconf ninja python -y
          refreshenv
          "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Fix PATH order (VS tools before MSYS2)
        shell: pwsh
        run: |
          # Ensure VS cl.exe/link.exe come before MSYS2/Git tools
          # Also preserve SystemRoot for cmd.exe built-ins (chcp, where)
          # Detect VS path from VCINSTALLDIR (set by vcvarsall in previous step)
          $vcInstallDir = $env:VCINSTALLDIR
          if (-not $vcInstallDir) {
            # Fallback to known path
            $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\HostX64\x64"
          } else {
            # VCINSTALLDIR is like "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\"
            # VS tools are at VCINSTALLDIR\Tools\MSVC\<version>\bin\HostX64\x64
            $msvcDir = Join-Path $vcInstallDir "Tools\MSVC"
            if (Test-Path $msvcDir) {
              $versions = Get-ChildItem $msvcDir -Directory | Sort-Object Name -Descending
              if ($versions.Count -gt 0) {
                $vsPath = Join-Path $versions[0].FullName "bin\HostX64\x64"
              } else {
                $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\HostX64\x64"
              }
            } else {
              $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.44.35207\bin\HostX64\x64"
            }
          }

          # SystemRoot for cmd.exe built-ins
          $systemRoot = $env:SystemRoot
          if (-not $systemRoot) { $systemRoot = "C:\Windows" }
          $systemPath = Join-Path $systemRoot "System32"

          Write-Host "Using VS path: $vsPath"
          Write-Host "System path: $systemPath"
          $currentPath = $env:PATH
          $pathParts = $currentPath -split ';'

          # Remove any existing VS/MSYS2 paths
          $filtered = $pathParts | Where-Object {
            $_ -notlike '*Microsoft Visual Studio*VC\Tools\MSVC*' -and
            $_ -notlike '*msys64*' -and
            $_ -notlike '*Git\usr\bin*'
          }

          # Prepend VS path, then SystemRoot, then rest
          # This ensures: VS tools first, then cmd.exe built-ins work, then everything else
          $newPath = @($vsPath, $systemPath) + $filtered -join ';'
          $env:PATH = $newPath
          "PATH=$newPath" >> $env:GITHUB_PATH
          Write-Host "PATH reordered: VS tools first, then SystemRoot"
          Write-Host "New PATH: $newPath"

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Free disk space (pre-prepare cleanup)
        shell: pwsh
        run: |
          # Remove unnecessary Windows components to free space
          Write-Host "Free space before cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-Table -AutoSize
          # Clean temp
          if (Test-Path "$env:TEMP") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TEMP\*" }
          if (Test-Path "$env:TMP") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TMP\*" }
          # Clean NuGet cache
          if (Test-Path "$env:USERPROFILE\.nuget\packages") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:USERPROFILE\.nuget\packages\*" }
          # Clean Chocolatey cache
          if (Test-Path "C:\ProgramData\chocolatey\lib") { Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:\ProgramData\chocolatey\lib\*" }
          Write-Host "Free space after cleanup:"
          Get-PSDrive C | Select-Object Used,Free | Format-Table -AutoSize

      - name: Cache ThirdParty
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\TBuild\${{ github.event.repository.name }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Cache Libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\Qt*
          key: ${{ runner.OS }}-x64-libs-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\Qt*
            ${{ env.LibrariesPath }}\cache_keys\Qt*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Prepare Libraries (win.bat)
        shell: pwsh
        run: |
          # Use already-configured environment from previous steps (Setup MSVC + Fix PATH order)
          # This preserves Chocolatey (python, ninja), Git, and MSVC env vars (Platform, VCINSTALLDIR, etc.)
          cd "${{ github.workspace }}\TBuild\${{ github.event.repository.name }}"
          $env:QT = "5.15.19"
          $env:X8664 = "x64"

          # Ensure SystemRoot is set for cmd.exe built-ins (chcp, where)
          $systemRoot = $env:SystemRoot
          if (-not $systemRoot) { $systemRoot = "C:\Windows" }

          # Use current environment which includes MSVC vars from GITHUB_ENV and fixed PATH from GITHUB_PATH
          $mergedEnv = @{}
          foreach ($key in [Environment]::GetEnvironmentVariables().Keys) {
            $mergedEnv[$key] = [Environment]::GetEnvironmentVariables()[$key]
          }
          # Ensure critical MSVC variables are present (from Setup MSVC step's GITHUB_ENV)
          $msvcVars = @("Platform", "VCINSTALLDIR", "VSINSTALLDIR", "VCToolsVersion", "WindowsSDKVersion", "LibPath", "IncludePath", "LIB", "INCLUDE")
          foreach ($v in $msvcVars) {
            if (-not $mergedEnv.ContainsKey($v)) {
              # Try to get from process env (GITHUB_ENV should have set these)
              $val = Get-Item "env:$v" -ErrorAction SilentlyContinue
              if ($val) { $mergedEnv[$v] = $val.Value }
            }
          }
          $mergedEnv['SystemRoot'] = $systemRoot
          $mergedEnv['QT'] = "5.15.19"
          $mergedEnv['X8664'] = "x64"

          Write-Host "Running prepare.py with Platform=$($mergedEnv['Platform']), VCINSTALLDIR=$($mergedEnv['VCINSTALLDIR'])"
          Write-Host "Running prepare.py with PATH: $($mergedEnv['Path'])"

          # Use Start-Process with explicit environment hashtable
          $startInfo = @{
            FilePath = "python"
            ArgumentList = "Telegram\build\prepare\prepare.py", "skip-release", "silent"
            WorkingDirectory = "${{ github.workspace }}\TBuild\${{ github.event.repository.name }}"
            Environment = $mergedEnv
            Wait = $true
            NoNewWindow = $true
            PassThru = $true
          }
          $process = Start-Process @startInfo
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Free disk space (cleanup ThirdParty after prepare)
        shell: pwsh
        run: |
          # Remove ThirdParty - no longer needed after prepare
          $repoName = "${{ github.event.repository.name }}"
          $thirdParty = "${{ github.workspace }}\TBuild\$repoName\ThirdParty"
          if (Test-Path $thirdParty) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $thirdParty
            Write-Host "Removed ThirdParty: $thirdParty"
          }
          # Clean Libraries: keep only .lib, .a, .exe, headers, .cmake, .pc, include/, objects-*, cache_keys/, patches/, nv-codec-headers/
          $libsPath = "${{ env.LibrariesPath }}"
          if (Test-Path $libsPath) {
            Get-ChildItem -Recurse -File $libsPath | Where-Object {
              $_.Extension -notin '.lib','.a','.exe','.h','.hpp','.inc','.cmake','.pc' -and
              $_.FullName -notmatch '\\include\\' -and
              $_.FullName -notmatch '\\objects-.*\\' -and
              $_.FullName -notmatch '\\cache_keys\\' -and
              $_.FullName -notmatch '\\patches\\' -and
              $_.FullName -notmatch '\\nv-codec-headers\\'
            } | Remove-Item -Force -ErrorAction SilentlyContinue
            # Remove empty directories
            Get-ChildItem -Recurse -Directory $libsPath | Where-Object { @(Get-ChildItem -Recurse $_).Count -eq 0 } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Cleaned Libraries: $libsPath"
          }
          # Show free space
          $disk = Get-PSDrive C
          Write-Host "Free space: $([math]::Round($disk.Free/1GB, 2)) GB"

      - name: Configure CMake (Debug, Qt5)
        shell: pwsh
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $tbuild = "${{ github.workspace }}\TBuild"
          Set-Location "$tbuild\$repoName\Telegram"
          $env:QT = "5.15.19"
          $env:QT_VERSION_MAJOR = "5"
          # Ensure SystemRoot is set for cmd.exe built-ins
          $env:SystemRoot = $env:SystemRoot ?? "C:\Windows"
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 10.0.26100.0 -vcvars_ver=14.44
          & "configure.bat" x64 -D TDESKTOP_API_ID=$env:TDESKTOP_API_ID -D TDESKTOP_API_HASH=$env:TDESKTOP_API_HASH -D CMAKE_CONFIGURATION_TYPES=Debug -D CMAKE_COMPILE_WARNING_AS_ERROR=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF -D QT_VERSION_MAJOR=5

      - name: Build Telegram (Debug)
        shell: pwsh
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $tbuild = "${{ github.workspace }}\TBuild"
          $env:QT = "5.15.19"
          # Ensure SystemRoot is set for cmd.exe built-ins
          $env:SystemRoot = $env:SystemRoot ?? "C:\Windows"
          & "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 10.0.26100.0 -vcvars_ver=14.44
          cmake --build "$tbuild\$repoName\out" --config Debug --parallel

      - name: Prepare artifacts
        shell: pwsh
        run: |
          $repoName = "${{ github.event.repository.name }}"
          $tbuild = "${{ github.workspace }}\TBuild"
          $out = "$tbuild\$repoName\out\Debug"
          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          Copy-Item "$out\Telegram.exe" "artifact\"
          Copy-Item "$out\Updater.exe" "artifact\"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Debug-x64
          path: artifact/
          retention-days: 30

      - name: Create Release (on tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifact/Telegram.exe
            artifact/Updater.exe
          generate_release_notes: true